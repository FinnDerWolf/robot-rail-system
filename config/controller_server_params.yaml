controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false

    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    publish_zero_velocity: true
    failure_tolerance: -1.0
    odom_topic: /odom

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    # Das Ziel bleibt bei einem Hindernis aktiv, damit die Fahrt nach Freigabe
    # des Pfads automatisch fortgesetzt werden kann.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 86400.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.20
      lookahead_dist: 0.30
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.40
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      transform_tolerance: 0.20
      rotate_to_heading_angular_vel: 0.60
      rotate_to_heading_min_angle: 0.50
      max_angular_accel: 1.0
      use_rotate_to_heading: true
      allow_reversing: false

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.50

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.80
      regulated_linear_scaling_min_speed: 0.12

      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      max_robot_pose_search_dist: 10.0

# Die lokale Costmap arbeitet im kontinuierlichen Odometrie-Frame. Dadurch
# kann der Controller bereits aktiv werden, bevor AMCL nach dem Setzen der
# Initialpose map -> odom publiziert. Hindernisse kommen direkt vom SICK-Laser.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.20

      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.225, 0.205], [0.225, -0.205], [-0.225, -0.205], [-0.225, 0.205]]"
      footprint_padding: 0.02

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.05
          obstacle_max_range: 2.5
          raytrace_min_range: 0.05
          raytrace_max_range: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: true
